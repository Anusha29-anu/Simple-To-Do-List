<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple To-Do List</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
         :root {
            --primary: #81a3cd;
            --secondary: #beddf2;
            --accent: #2a0219;
            --success: #32CD32;
            --warning: #FFD700;
            --danger: #FF4500;
            --dark: #2C2C54;
            --light: #F7F7F7;
            --text: #ae9d47;
            --text-light: #777777;
            --shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }
        
        body {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            background-color: white;
            border-radius: 20px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 900px;
            padding: 30px;
            margin: 20px 0;
            transition: var(--transition);
        }
        
        header {
            text-align: center;
            margin-bottom: 25px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        header h1 {
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            font-weight: 700;
        }
        
        header p {
            font-size: clamp(0.9rem, 2.5vw, 1.2rem);
            color: var(--text-light);
        }
        
        .input-section {
            display: flex;
            margin-bottom: 20px;
            gap: 10px;
        }
        
        #taskInput {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #E0E0E0;
            border-radius: 12px;
            font-size: clamp(1rem, 2.5vw, 1.1rem);
            transition: var(--transition);
            min-width: 0;
            background-color: var(--light);
        }
        
        #taskInput:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 206, 209, 0.2);
        }
        
        #addTaskBtn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 15px 25px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            font-size: clamp(0.9rem, 2.5vw, 1rem);
        }
        
        #addTaskBtn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
            box-shadow: 0 5px 15px rgba(138, 43, 226, 0.3);
        }
        
        .filter-section {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #E0E0E0;
            background: white;
            border-radius: 25px;
            cursor: pointer;
            transition: var(--transition);
            font-size: clamp(0.85rem, 2.5vw, 1rem);
            flex: 1;
            min-width: 100px;
            max-width: 150px;
            font-weight: 500;
        }
        
        .filter-btn.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border-color: transparent;
        }
        
        .stats {
            text-align: center;
            margin-bottom: 15px;
            color: var(--text-light);
            font-size: clamp(0.85rem, 2.5vw, 1rem);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }
        
        .progress-bar {
            height: 8px;
            background-color: #E0E0E0;
            border-radius: 4px;
            margin-top: 5px;
            overflow: hidden;
            flex: 1;
            max-width: 200px;
        }
        
        .progress {
            height: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        
        #taskList {
            list-style-type: none;
            margin-bottom: 20px;
        }
        
        .task-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            background-color: white;
            border-radius: 12px;
            margin-bottom: 12px;
            transition: var(--transition);
            animation: fadeIn 0.4s ease;
            gap: 15px;
            border-left: 5px solid var(--accent);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .task-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .task-item.completed {
            opacity: 0.7;
            border-left-color: var(--success);
            background-color: rgba(50, 205, 50, 0.05);
        }
        
        .task-checkbox {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .task-checkbox input {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: var(--accent);
        }
        
        .task-text {
            flex: 1;
            word-break: break-word;
            font-size: clamp(0.95rem, 2.5vw, 1.05rem);
            line-height: 1.5;
            color: var(--text);
        }
        
        .task-item.completed .task-text {
            text-decoration: line-through;
            color: var(--text-light);
        }
        
        .task-actions {
            display: flex;
            gap: 8px;
        }
        
        .complete-btn,
        .delete-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 8px;
            border-radius: 50%;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
        }
        
        .complete-btn {
            color: var(--success);
        }
        
        .complete-btn:hover {
            background-color: rgba(50, 205, 50, 0.1);
            transform: scale(1.1);
        }
        
        .delete-btn {
            color: var(--danger);
        }
        
        .delete-btn:hover {
            background-color: rgba(255, 69, 0, 0.1);
            transform: scale(1.1);
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
        }
        
        .empty-state i {
            font-size: clamp(3rem, 15vw, 5rem);
            margin-bottom: 20px;
            opacity: 0.5;
            color: var(--primary);
        }
        
        .empty-state h3 {
            font-size: clamp(1.3rem, 4vw, 1.8rem);
            margin-bottom: 10px;
            color: var(--dark);
        }
        
        .empty-state p {
            font-size: clamp(1rem, 2.5vw, 1.1rem);
        }
        
        .mobile-actions {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            border-radius: 50px;
            padding: 10px 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            z-index: 100;
        }
        
        .mobile-action-btn {
            background: none;
            border: none;
            padding: 10px 15px;
            font-size: 1.2rem;
            color: var(--primary);
            cursor: pointer;
            border-radius: 50%;
            transition: var(--transition);
        }
        
        .mobile-action-btn:hover {
            background-color: rgba(138, 43, 226, 0.1);
        }
        /* Responsive Design */
        /* Large Desktop (1200px+) */
        
        @media (min-width: 1200px) {
            .container {
                max-width: 1000px;
                padding: 40px;
            }
            .task-item {
                padding: 20px 25px;
            }
        }
        /* Tablet Landscape (768px - 991px) */
        
        @media (max-width: 991px) and (min-width: 768px) {
            .container {
                padding: 25px;
            }
            .input-section {
                flex-direction: row;
            }
            .task-item {
                padding: 15px 20px;
            }
            .task-actions {
                flex-direction: column;
                gap: 5px;
            }
        }
        /* Tablet Portrait (600px - 767px) */
        
        @media (max-width: 767px) and (min-width: 600px) {
            body {
                padding: 15px;
            }
            .container {
                padding: 20px;
                border-radius: 16px;
            }
            .input-section {
                flex-direction: column;
            }
            #addTaskBtn {
                justify-content: center;
                padding: 12px;
            }
            .filter-btn {
                min-width: 120px;
                padding: 8px 15px;
            }
            .task-item {
                padding: 12px 15px;
            }
            .stats {
                flex-direction: column;
                gap: 10px;
            }
            .progress-bar {
                max-width: 100%;
                width: 100%;
            }
        }
        /* Mobile Landscape (480px - 599px) */
        
        @media (max-width: 599px) and (min-width: 480px) {
            body {
                padding: 10px;
            }
            .container {
                padding: 15px;
                border-radius: 14px;
            }
            .input-section {
                flex-direction: column;
                gap: 12px;
            }
            #taskInput {
                padding: 12px 15px;
            }
            #addTaskBtn {
                padding: 12px;
                justify-content: center;
            }
            .filter-section {
                gap: 8px;
            }
            .filter-btn {
                min-width: 0;
                padding: 8px 12px;
                font-size: 0.9rem;
            }
            .task-item {
                flex-direction: row;
                align-items: center;
                padding: 12px 15px;
                gap: 12px;
            }
            .task-actions {
                gap: 5px;
            }
            .complete-btn,
            .delete-btn {
                width: 36px;
                height: 36px;
                font-size: 1rem;
            }
            .mobile-actions {
                display: flex;
                gap: 15px;
            }
        }
        /* Mobile Portrait (360px - 479px) */
        
        @media (max-width: 479px) and (min-width: 360px) {
            body {
                padding: 8px;
            }
            .container {
                padding: 12px;
                border-radius: 12px;
            }
            header {
                margin-bottom: 20px;
            }
            .input-section {
                gap: 10px;
            }
            #taskInput {
                padding: 10px 12px;
                font-size: 16px;
            }
            #addTaskBtn {
                padding: 10px;
            }
            .filter-section {
                gap: 5px;
            }
            .filter-btn {
                padding: 6px 10px;
                font-size: 0.85rem;
                min-width: 0;
                flex: 1;
            }
            .task-item {
                padding: 10px 12px;
                gap: 10px;
            }
            .task-checkbox input {
                width: 20px;
                height: 20px;
            }
            .complete-btn,
            .delete-btn {
                width: 34px;
                height: 34px;
                padding: 6px;
            }
            .empty-state {
                padding: 30px 15px;
            }
            .mobile-actions {
                bottom: 15px;
                padding: 8px 15px;
            }
            .mobile-action-btn {
                padding: 8px 12px;
                font-size: 1.1rem;
            }
        }
        /* Small Mobile (under 360px) */
        
        @media (max-width: 359px) {
            body {
                padding: 5px;
            }
            .container {
                padding: 10px;
                border-radius: 10px;
            }
            .input-section {
                gap: 8px;
            }
            #taskInput {
                padding: 8px 10px;
            }
            #addTaskBtn {
                padding: 8px;
            }
            .filter-btn {
                padding: 5px 8px;
                font-size: 0.8rem;
            }
            .task-item {
                padding: 8px 10px;
                gap: 8px;
            }
            .task-checkbox input {
                width: 18px;
                height: 18px;
            }
            .complete-btn,
            .delete-btn {
                width: 32px;
                height: 32px;
                padding: 5px;
                font-size: 0.9rem;
            }
            .mobile-actions {
                bottom: 10px;
                padding: 6px 12px;
            }
        }
        /* Dark mode support */
        
        @media (prefers-color-scheme: dark) {
             :root {
                --text: #F0F0F0;
                --text-light: #B0B0B0;
                --light: #2A2A2A;
            }
            .container {
                background-color: #1A1A1A;
            }
            .task-item {
                background-color: #2A2A2A;
            }
            #taskInput {
                background-color: #2A2A2A;
                color: #F0F0F0;
                border-color: #404040;
            }
            .filter-btn {
                background-color: #2A2A2A;
                color: #F0F0F0;
                border-color: #404040;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-check-double"></i> Simple To-Do List</h1>
            <p>Stay organized and productive!</p>
        </header>

        <div class="input-section">
            <input type="text" id="taskInput" placeholder="What needs to be done?">
            <button id="addTaskBtn"><i class="fas fa-plus"></i> <span class="btn-text">Add Task</span></button>
        </div>

        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <div class="stats">
            <span id="taskCount">0 tasks</span>
            <div class="progress-bar">
                <div class="progress" id="progressBar" style="width: 0%"></div>
            </div>
            <span id="completionRate">0% done</span>
        </div>

        <ul id="taskList">
            <!-- Tasks will be added here dynamically -->
        </ul>

        <div class="empty-state" id="emptyState">
            <i class="fas fa-clipboard-check"></i>
            <h3>No tasks yet</h3>
            <p>Add your first task to get started!</p>
        </div>
    </div>

    <div class="mobile-actions">
        <button class="mobile-action-btn" id="mobileAddBtn" title="Add Task">
            <i class="fas fa-plus"></i>
        </button>
        <button class="mobile-action-btn" id="mobileClearBtn" title="Clear Completed">
            <i class="fas fa-broom"></i>
        </button>
        <button class="mobile-action-btn" id="mobileFilterBtn" title="Filter Tasks">
            <i class="fas fa-filter"></i>
        </button>
    </div>

    <script>
        // DOM Elements
        const taskInput = document.getElementById('taskInput');
        const addTaskBtn = document.getElementById('addTaskBtn');
        const taskList = document.getElementById('taskList');
        const taskCount = document.getElementById('taskCount');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const emptyState = document.getElementById('emptyState');
        const progressBar = document.getElementById('progressBar');
        const completionRate = document.getElementById('completionRate');
        const mobileAddBtn = document.getElementById('mobileAddBtn');
        const mobileClearBtn = document.getElementById('mobileClearBtn');
        const mobileFilterBtn = document.getElementById('mobileFilterBtn');

        // State
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        let currentFilter = 'all';
        let isFilterVisible = true;

        // Initialize the app
        function init() {
            renderTasks();
            updateTaskCount();
            updateProgressBar();

            // Event Listeners
            addTaskBtn.addEventListener('click', addTask);
            taskInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') addTask();
            });

            filterBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');

                    currentFilter = this.getAttribute('data-filter');
                    renderTasks();
                });
            });

            // Mobile actions
            mobileAddBtn.addEventListener('click', addTask);
            mobileClearBtn.addEventListener('click', clearCompletedTasks);
            mobileFilterBtn.addEventListener('click', toggleFilterVisibility);

            // Responsive adjustments
            updateButtonText();
            window.addEventListener('resize', updateButtonText);

            // Focus on input for better UX
            taskInput.focus();
        }

        // Update button text based on screen size
        function updateButtonText() {
            const btnText = document.querySelector('.btn-text');
            if (window.innerWidth <= 480) {
                btnText.textContent = 'Add';
            } else {
                btnText.textContent = 'Add Task';
            }

            // Show/hide mobile actions based on screen size
            if (window.innerWidth <= 599) {
                document.querySelector('.mobile-actions').style.display = 'flex';
            } else {
                document.querySelector('.mobile-actions').style.display = 'none';
            }
        }

        // Toggle filter visibility on mobile
        function toggleFilterVisibility() {
            isFilterVisible = !isFilterVisible;
            document.querySelector('.filter-section').style.display = isFilterVisible ? 'flex' : 'none';
        }

        // Add a new task
        function addTask() {
            const text = taskInput.value.trim();

            if (text === '') {
                showNotification('Please enter a task!', 'warning');
                return;
            }

            const newTask = {
                id: Date.now(),
                text: text,
                completed: false,
                createdAt: new Date().toISOString()
            };

            tasks.push(newTask);
            saveTasks();
            renderTasks();
            updateTaskCount();
            updateProgressBar();

            // Clear input and show success message
            taskInput.value = '';
            taskInput.focus();
            showNotification('Task added successfully!', 'success');
        }

        // Toggle task completion
        function toggleTask(id) {
            tasks = tasks.map(task => {
                if (task.id === id) {
                    return {...task,
                        completed: !task.completed
                    };
                }
                return task;
            });

            saveTasks();
            renderTasks();
            updateTaskCount();
            updateProgressBar();
        }

        // Delete a task
        function deleteTask(id) {
            if (confirm('Are you sure you want to delete this task?')) {
                tasks = tasks.filter(task => task.id !== id);
                saveTasks();
                renderTasks();
                updateTaskCount();
                updateProgressBar();
                showNotification('Task deleted!', 'info');
            }
        }

        // Clear all completed tasks
        function clearCompletedTasks() {
            if (tasks.filter(task => task.completed).length === 0) {
                showNotification('No completed tasks to clear!', 'info');
                return;
            }

            if (confirm('Are you sure you want to clear all completed tasks?')) {
                tasks = tasks.filter(task => !task.completed);
                saveTasks();
                renderTasks();
                updateTaskCount();
                updateProgressBar();
                showNotification('Completed tasks cleared!', 'success');
            }
        }

        // Save tasks to localStorage
        function saveTasks() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        // Update progress bar
        function updateProgressBar() {
            const totalTasks = tasks.length;
            const completedTasks = tasks.filter(task => task.completed).length;
            const percentage = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;

            progressBar.style.width = `${percentage}%`;
            completionRate.textContent = `${percentage}% done`;
        }

        // Show notification
        function showNotification(message, type) {
            const notification = document.createElement('div');
            notification.textContent = message;

            let bgColor;
            switch (type) {
                case 'success':
                    bgColor = '#32CD32';
                    break;
                case 'warning':
                    bgColor = '#FFD700';
                    break;
                case 'info':
                    bgColor = '#00CED1';
                    break;
                default:
                    bgColor = '#8A2BE2';
            }

            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: ${bgColor};
                color: white;
                padding: 15px 20px;
                border-radius: 10px;
                box-shadow: 0 5px 15px rgba(0,0,0,0.2);
                z-index: 1000;
                transform: translateX(150%);
                transition: transform 0.3s ease;
                font-weight: 500;
            `;

            document.body.appendChild(notification);

            setTimeout(() => {
                notification.style.transform = 'translateX(0)';
            }, 100);

            setTimeout(() => {
                notification.style.transform = 'translateX(150%)';
                setTimeout(() => {
                    document.body.removeChild(notification);
                }, 300);
            }, 3000);
        }

        // Render tasks based on current filter
        function renderTasks() {
            let filteredTasks = tasks;

            if (currentFilter === 'active') {
                filteredTasks = tasks.filter(task => !task.completed);
            } else if (currentFilter === 'completed') {
                filteredTasks = tasks.filter(task => task.completed);
            }

            taskList.innerHTML = '';

            if (filteredTasks.length === 0) {
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';

                filteredTasks.forEach(task => {
                    const taskItem = document.createElement('li');
                    taskItem.className = `task-item ${task.completed ? 'completed' : ''}`;

                    taskItem.innerHTML = `
                        <div class="task-checkbox">
                            <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.id})">
                        </div>
                        <span class="task-text">${task.text}</span>
                        <div class="task-actions">
                            <button class="complete-btn" onclick="toggleTask(${task.id})" title="${task.completed ? 'Mark as incomplete' : 'Mark as complete'}">
                                <i class="fas fa-${task.completed ? 'undo' : 'check'}"></i>
                            </button>
                            <button class="delete-btn" onclick="deleteTask(${task.id})" title="Delete task">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    `;

                    taskList.appendChild(taskItem);
                });
            }
        }

        // Update task counter
        function updateTaskCount() {
            const totalTasks = tasks.length;
            const completedTasks = tasks.filter(task => task.completed).length;
            const activeTasks = totalTasks - completedTasks;

            let countText = '';

            if (currentFilter === 'all') {
                countText = `${totalTasks} task${totalTasks !== 1 ? 's' : ''} total`;
            } else if (currentFilter === 'active') {
                countText = `${activeTasks} active task${activeTasks !== 1 ? 's' : ''}`;
            } else if (currentFilter === 'completed') {
                countText = `${completedTasks} completed task${completedTasks !== 1 ? 's' : ''}`;
            }

            taskCount.textContent = countText;
        }

        // Initialize the app when the DOM is loaded
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
